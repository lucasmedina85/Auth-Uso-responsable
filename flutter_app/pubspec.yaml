name: authenticator_juego_responsable
description: "Authenticator | Juego Responsable - Flutter KYC Identity Verification MVP"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Design & UI
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10

  # Hardware & Security APIs
  camera: ^0.10.5+9
  local_auth: ^2.1.8
  permission_handler: ^11.3.0
  device_info_plus: ^9.1.2
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_barcode_scanning: ^0.12.0
  google_mlkit_face_detection: ^0.11.0
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  cross_file: ^0.3.4
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  shared_preferences: ^2.2.2

  # Utility & State
  intl: ^0.19.0
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/auth_light.png
    - assets/images/auth_dark.png
